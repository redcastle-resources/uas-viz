name: Deploy static sites to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "potree-static-site/**"
      - "dtm-static-site/**"
      - "landing-page/**"
      - ".github/workflows/deploy-pages.yml"
  # Manually re-run from the Actions tab if a push-triggered run fails (e.g. repo was private).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Combine the landing page + both viewers into one artifact:
      #   /            -> landing-page/index.html
      #   /potree/...  -> potree-static-site/
      #   /dtm/...     -> dtm-static-site/
      - name: Assemble combined site
        run: |
          mkdir -p _site/potree _site/dtm
          cp -r potree-static-site/. _site/potree/
          cp -r dtm-static-site/. _site/dtm/
          cp landing-page/index.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
