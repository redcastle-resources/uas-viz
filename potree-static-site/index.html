<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potree Static Point Cloud Viewer</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.9);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --warn: #f59e0b;
      }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: var(--panel);
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }

      #title {
        font-size: 16px;
        font-weight: 700;
      }

      #cloud-name {
        color: var(--accent);
      }

      #status {
        color: var(--muted);
        font-size: 12px;
      }

      #potree_container {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      #potree_render_area {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
      }

      #loading_info {
        position: absolute;
        left: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.75);
        color: var(--text);
        font-size: 12px;
        z-index: 10;
      }

      .fatal {
        color: var(--warn);
      }
    </style>

    <link rel="stylesheet" href="./vendor/potree/build/potree/potree.css" />
    <link rel="stylesheet" href="./vendor/potree/libs/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="./vendor/potree/libs/openlayers3/ol.css" />
    <link rel="stylesheet" href="./vendor/potree/libs/spectrum/spectrum.css" />
    <link rel="stylesheet" href="./vendor/potree/libs/jstree/themes/mixed/style.css" />
  </head>

  <body>
    <div id="topbar">
      <div id="title">Potree Cloud: <span id="cloud-name">mycloud</span></div>
      <div id="status">Waiting for point cloud…</div>
    </div>

    <div id="potree_container">
      <div id="potree_render_area"></div>
      <div id="loading_info">Loading point cloud…</div>
    </div>

    <script src="./vendor/potree/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./vendor/potree/libs/spectrum/spectrum.js"></script>
    <script src="./vendor/potree/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./vendor/potree/libs/other/BinaryHeap.js"></script>
    <script src="./vendor/potree/libs/tween/tween.min.js"></script>
    <script src="./vendor/potree/libs/d3/d3.js"></script>
    <script src="./vendor/potree/libs/proj4/proj4.js"></script>
    <script src="./vendor/potree/libs/openlayers3/ol.js"></script>
    <script src="./vendor/potree/libs/i18next/i18next.js"></script>
    <script src="./vendor/potree/libs/jstree/jstree.js"></script>
    <script src="./vendor/potree/build/potree/potree.js"></script>

    <script>
      // Add one entry per point cloud you want loaded into the scene.
      // Point cloud data (octree.bin/hierarchy.bin/metadata.json) is served from a public GCS bucket.
      const GCS_BASE = 'https://storage.googleapis.com/uas-viz/pointclouds';
      const clouds = [
        { path: `${GCS_BASE}/AOI_5.las_converted/metadata.json`, name: 'AOI_5' },
        { path: `${GCS_BASE}/AOI_6.las_converted/metadata.json`, name: 'AOI_6' },
      ];
      const statusEl = document.getElementById('status');
      const loadingInfo = document.getElementById('loading_info');

      function setStatus(message, isFatal = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('fatal', isFatal);
      }

      function loadViewer() {
        if (!window.Potree) {
          setStatus('Potree files not found. Place the Potree build under ./vendor/potree and refresh.', true);
          loadingInfo.textContent = 'Missing Potree build';
          return;
        }

        const viewer = new Potree.Viewer(document.getElementById('potree_render_area'), {
          useDefaultRenderLoop: true,
          showBoundingBox: false,
          showProfile: false,
        });

        viewer.setEDLEnabled(true);
        viewer.setFOV(60);

        document.getElementById('cloud-name').textContent = clouds.map(c => c.name).join(', ');

        let remaining = clouds.length;
        let failed = 0;

        clouds.forEach(cloud => {
          Potree.loadPointCloud(cloud.path, cloud.name, function(event) {
            const pointcloud = event.pointcloud;
            pointcloud.material.size = 1;
            pointcloud.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            pointcloud.material.shape = Potree.PointShape.SQUARE;

            viewer.scene.addPointCloud(pointcloud);
            viewer.fitToScreen();

            remaining -= 1;
            if (remaining === 0) {
              setStatus(failed ? `${clouds.length - failed}/${clouds.length} point clouds loaded` : 'All point clouds loaded');
              loadingInfo.textContent = 'Ready';
            }
          }, function(error) {
            console.error('Point cloud failed to load:', cloud.path, error);
            failed += 1;
            remaining -= 1;
            if (remaining === 0) {
              setStatus(`${clouds.length - failed}/${clouds.length} point clouds loaded`, failed === clouds.length);
              loadingInfo.textContent = failed === clouds.length ? 'All clouds failed to load' : 'Ready (with errors)';
            }
          });
        });
      }

      window.addEventListener('load', function () {
        const missing = clouds.filter(cloud => {
          const test = new XMLHttpRequest();
          test.open('HEAD', cloud.path, false);
          test.send();
          return test.status === 404;
        });

        if (missing.length === clouds.length) {
          setStatus('No point clouds found. Check the paths in the `clouds` array.', true);
          loadingInfo.textContent = 'Expected: ./pointclouds/<name>/metadata.json';
          return;
        }

        if (missing.length > 0) {
          console.warn('Missing point clouds:', missing.map(c => c.path));
        }

        loadViewer();
      });
    </script>
  </body>
</html>
